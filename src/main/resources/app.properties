# Configuración de la aplicación (SQL Server).
# Cada valor puede sobrescribirse con una variable de entorno:
#   PRESTAMOS_DB_HOST, PRESTAMOS_DB_PORT, PRESTAMOS_DB_NAME,
#   PRESTAMOS_DB_USER, PRESTAMOS_DB_PASS, PRESTAMOS_DB_TRUST_CERT, PRESTAMOS_TZ, PRESTAMOS_DNI_TOKEN
#
# IMPORTANTE: no subas la contraseña real a Git. Lo ideal es definir PRESTAMOS_DB_PASS
# en la configuración de ejecución de Tomcat en IntelliJ (Environment variables).
db.host=localhost
db.port=1433
db.name=prestamos_equipos
db.user=superadmin
db.password=2026
db.trustServerCertificate=true
db.poolSize=10
app.timezone=America/Lima

# Token del servicio de consulta de DNI (RENIEC vía Decolecta), usado en "Nuevo usuario" > Buscar.
# Si lo dejas vacío se usa solo el proveedor de respaldo (apis.net.pe).
dni.api.token=

# Asistente IA (la clave se configura solo en el servidor, nunca en JavaScript)
ai.api.key=
ai.model=gpt-5.6-luna
ai.endpoint=https://api.openai.com/v1/chat/completions
ai.timeout.seconds=35
